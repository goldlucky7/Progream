name: 사진 정리 도우미 웹 배포 (GitHub Pages)

on:
  push:
    branches: [claude/phone-gallery-organizer-ewh7sz, main, master]
    paths:
      - "photo_organizer/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: photo_organizer
      - id: deployment
        uses: actions/deploy-pages@v4
