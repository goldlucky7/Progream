name: 사진 정리 도우미 웹 배포 (GitHub Pages)

# photo_organizer가 바뀌면 gh-pages 브랜치로 자동 반영 →
# https://goldlucky7.github.io/Progream/ 에 게시됩니다.
on:
  push:
    branches: [claude/android-apk-build-install-x732yk, claude/phone-gallery-organizer-ewh7sz, main, master]
    paths:
      - "photo_organizer/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 배포 폴더 준비
        run: |
          mkdir -p _site
          cp photo_organizer/index.html photo_organizer/manifest.webmanifest photo_organizer/icon-192.png photo_organizer/icon-512.png _site/
          touch _site/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          commit_message: "웹 배포 자동 업데이트"
